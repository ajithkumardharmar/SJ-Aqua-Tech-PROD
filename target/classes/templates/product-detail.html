<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Product Details | SJ Aqua Tech')}"></head><body><div th:replace="~{fragments/header :: nav}"></div><main class="container section"><div class="row g-4"><div class="col-md-6"><img class="detail-img" th:if="${product.imageUrl != null and !product.imageUrl.isBlank()}" th:src="${product.imageUrl}" alt="Product"></div><div class="col-md-6"><span class="eyebrow" th:text="${product.category}"></span><h1 th:text="${product.name}"></h1><p th:text="${product.description}"></p><h3 th:if="${product.price != null}" th:text="'₹' + ${product.price}"></h3><a class="btn btn-aqua" th:href="@{/booking}">Enquire / Book Service</a></div></div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
