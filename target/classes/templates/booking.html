<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Book Service | SJ Aqua Tech')}"></head><body><div th:replace="~{fragments/header :: nav}"></div><main class="container section form-wrap"><span class="eyebrow">SERVICE REQUEST</span><h1>Book an RO Service</h1><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><form th:action="@{/booking}" th:object="${booking}" method="post"><div class="mb-3"><label class="form-label">Your Name</label><input class="form-control" th:field="*{customerName}" required><small class="text-danger" th:errors="*{customerName}"></small></div><div class="mb-3"><label class="form-label">Phone Number</label><input class="form-control" th:field="*{phone}" required><small class="text-danger" th:errors="*{phone}"></small></div><div class="mb-3"><label class="form-label">Service Type</label><select class="form-select" th:field="*{serviceType}" required><option value="">Choose a service</option><option>Installation</option><option>General Service</option><option>Repair</option><option>Filter Replacement</option><option>Commercial RO Enquiry</option></select></div><div class="mb-3"><label class="form-label">Address</label><textarea class="form-control" rows="3" th:field="*{address}" required></textarea></div><button class="btn btn-aqua">Submit Booking</button></form></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
