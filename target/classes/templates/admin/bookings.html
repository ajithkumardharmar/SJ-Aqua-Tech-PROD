<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Bookings')}"></head><body><main class="container section"><h1>Service Bookings</h1><a class="btn btn-secondary mb-3" th:href="@{/admin}">Dashboard</a><div class="table-responsive"><table class="table table-striped"><thead><tr><th>Name</th><th>Phone</th><th>Service</th><th>Address</th><th>Status</th><th>Update</th></tr></thead><tbody><tr th:each="b : ${bookings}"><td th:text="${b.customerName}"></td><td th:text="${b.phone}"></td><td th:text="${b.serviceType}"></td><td th:text="${b.address}"></td><td th:text="${b.status}"></td><td><form th:action="@{/admin/bookings/status/{id}(id=${b.id})}" method="post"><select name="status" class="form-select form-select-sm"><option>PENDING</option><option>CONFIRMED</option><option>COMPLETED</option><option>CANCELLED</option></select><button class="btn btn-sm btn-primary mt-1">Update</button></form></td></tr></tbody></table></div></main></body></html>
