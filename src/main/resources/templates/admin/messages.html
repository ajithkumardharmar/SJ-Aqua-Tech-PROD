<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Messages')}"></head><body><main class="container section"><h1>Contact Messages</h1><a class="btn btn-secondary mb-3" th:href="@{/admin}">Dashboard</a><div class="table-responsive"><table class="table table-striped"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Message</th><th>Date</th></tr></thead><tbody><tr th:each="m : ${messages}"><td th:text="${m.name}"></td><td th:text="${m.email}"></td><td th:text="${m.phone}"></td><td th:text="${m.message}"></td><td th:text="${m.createdAt}"></td></tr></tbody></table></div></main></body></html>
